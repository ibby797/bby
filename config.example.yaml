# quantbot configuration.
# Copy to config.yaml (gitignored) and adjust. Secrets belong in environment
# variables, NOT in this file:
#   Trading 212:  T212_API_KEY
#   Alpaca:       APCA_API_KEY_ID + APCA_API_SECRET_KEY
#   CCXT crypto:  CCXT_API_KEY + CCXT_SECRET

# Which venue to trade through: trading212 | alpaca | ccxt | paper
# "paper" is the built-in local simulator — works with no account at all.
broker: trading212

# Broker-specific settings (only the active broker's section matters).
brokers:
  alpaca:
    paper: true          # false = live Alpaca account (real money)
  ccxt:
    exchange: binance    # any ccxt exchange id: kraken, coinbase, bybit, okx...
    quote: USDT          # quote currency balances are measured in
    sandbox: false       # true = exchange testnet where supported
  paper:
    initial_cash: 10000
    ledger_path: paper_ledger.json

# Trading 212 only: "demo" = paper environment (recommended), "live" = real money.
environment: demo

# true = log every order instead of sending it. Set false only after you have
# watched the bot's decisions and are happy with them.
dry_run: true

# Required ONLY for real-money trading with dry_run false (T212 live, Alpaca
# live, or CCXT without sandbox). Type the phrase exactly:
# confirm_live: I_UNDERSTAND_REAL_MONEY_IS_AT_RISK
confirm_live: ""

# Optional Discord/Slack-compatible webhook for trade notifications.
webhook_url: ""

state_path: state.json

universe:
  # Broker symbol -> Yahoo Finance data symbol.
  #   Trading 212: AAPL_US_EQ: AAPL   (find tickers: run_bot.py instruments --search apple)
  #   Alpaca:      AAPL: AAPL
  #   CCXT crypto: BTC/USDT: BTC-USD  (also set schedule.market_hours_only: false)
  instruments:
    AAPL_US_EQ: AAPL
    MSFT_US_EQ: MSFT
    GOOGL_US_EQ: GOOGL
    AMZN_US_EQ: AMZN
    NVDA_US_EQ: NVDA
    META_US_EQ: META
    TSLA_US_EQ: TSLA
    JPM_US_EQ: JPM
    V_US_EQ: V
    JNJ_US_EQ: JNJ

# Market-regime filter: block NEW entries while the benchmark trades below its
# long moving average (exits keep working). Cheap, powerful drawdown reducer.
regime:
  enabled: true
  symbol: SPY
  sma_window: 200

strategy:
  # Ensemble score in [-1, 1] required to open a position...
  min_entry_score: 0.25
  # ...and to force-close one.
  exit_score: -0.25
  # Short selling: score <= -min_entry_score opens a short; score >= +0.25
  # covers it. Only works on brokers that can short (alpaca, paper) — Trading
  # 212 Invest/ISA and spot crypto are long-only and ignore this. When the
  # regime filter is on, shorts only open in risk-off markets. Shorts have
  # UNLIMITED theoretical loss — leave this off unless you know what it means.
  allow_short: false
  # Relative weights of the six models. Trend/momentum carry full weight;
  # mean-reversion gets half weight so it tempers entries without vetoing
  # trends; volume confirmation sits in between.
  weights:
    sma_crossover: 1.0
    donchian_breakout: 1.0
    macd_momentum: 1.0
    rsi_reversion: 0.5
    bollinger_reversion: 0.5
    obv_trend: 0.75

data:
  interval: 1d          # yfinance interval: 1d, 1h, 30m...
  lookback_days: 400
  cache_ttl_seconds: 300

risk:
  risk_per_trade_pct: 1.0          # % of equity risked between entry and stop
  max_position_pct: 20.0           # max % of equity in one position
  max_total_exposure_pct: 90.0
  max_open_positions: 5
  min_cash_buffer_pct: 5.0
  atr_stop_multiplier: 2.5
  atr_take_profit_multiplier: 5.0
  trailing_stop: true
  max_daily_loss_pct: 3.0          # halt new entries for the day
  max_drawdown_pct: 15.0           # halt + liquidate everything
  quantity_decimals: 4
  reentry_cooldown_hours: 24       # no re-entry into a ticker after an exit
  # --- win-rate / capital-efficiency refinements ---
  breakeven_at_r: 1.0              # stop -> entry once +1R in profit (0 = off)
  partial_tp_fraction: 0.5         # bank half at the first target (0 = off)
  max_holding_days: 45             # close stale going-nowhere positions (0 = off)

schedule:
  poll_seconds: 300
  market_hours_only: true   # set false for 24/7 markets (crypto via ccxt)
